name: Images

on:
  pull_request:
    paths:
      - Dockerfile.api
      - build.sbt
      - project/**
      - modules/**
      - platform/**
      - charts/promovolve/**
      - .github/workflows/images.yml
      - .github/workflows/ci.yml
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.image }} (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile.api
          - image: platform
            context: platform
            file: platform/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Report runner disk space
        run: df -h /
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name == 'push'
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile.api
          - image: platform
            context: platform
            file: platform/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Report runner disk space
        run: df -h /
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/promovolve-${{ matrix.image }}
        run: |
          set -euo pipefail

          short_sha=${GITHUB_SHA:0:12}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a semantic version tag like v0.1.0; got $GITHUB_REF_NAME" >&2
              exit 1
            fi
            primary_tag=$version
          else
            primary_tag=main
          fi

          {
            printf 'primary=%s\n' "${IMAGE}:${primary_tag}"
            printf 'tags<<EOF\n'
            printf '%s\n' "${IMAGE}:${primary_tag}" "${IMAGE}:sha-${short_sha}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record published digest
        env:
          IMAGE: ${{ steps.tags.outputs.primary }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Immutable reference: \`${IMAGE%@*}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    # A chart release depends on its default image tags existing first.
    # `needs` waits for every image in the publish matrix to finish.
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Check chart and image versions match the release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_VERSION#v}
          metadata=$(helm show chart charts/promovolve)
          grep -Fx "version: $version" <<<"$metadata"
          grep -Fx "appVersion: $version" <<<"$metadata"
      - name: Package chart
        run: helm package charts/promovolve --destination "$RUNNER_TEMP"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish chart
        run: helm push "$RUNNER_TEMP/promovolve-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
